<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 306" width="660" height="306" role="img" aria-labelledby="rawf-title rawf-desc">
  <title id="rawf-title">Right atrial pressure tracing aligned with the ECG</title>
  <desc id="rawf-desc">A right atrial or central venous pressure tracing drawn beneath a simultaneous ECG. The a wave follows the P wave and reflects atrial contraction. The c wave follows the QRS as the tricuspid valve closes and bulges into the atrium. The x descent follows as the atrium relaxes and the valve plane descends during ventricular systole. The v wave builds as the atrium fills against a closed tricuspid valve late in systole. The y descent follows tricuspid opening and early diastolic emptying. Ventricular systole spans from the QRS to the end of the T wave, and diastole runs from there to the next QRS.</desc>

  <!-- Redrawn for HemoSim, 2026-08-04, replacing a scanned raster figure.
       Neal asked for the z point label to be removed, which cannot be done
       cleanly inside a raster, so the figure is rebuilt as vector. The scan's
       show-through text from the reverse of the page is gone as a side effect.
       Landmark positions are shared between the two traces on purpose: the a
       wave sits after P, the c wave after the QRS, and the y descent after the
       T wave, because the alignment is the whole point of the figure.
       Do not write a CSS custom property name in this comment. A double hyphen
       is illegal inside an XML comment and the file will not render. -->

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">

    <!-- cycle phase bands, drawn first so the traces sit on top -->
    <rect x="168" y="24" width="140" height="228" fill="#eef2f7"/>
    <rect x="308" y="24" width="170" height="228" fill="#dde5ee"/>
    <text x="238" y="130" font-size="13" font-weight="700" fill="#4a5568" text-anchor="middle">Ventricular</text>
    <text x="238" y="146" font-size="13" font-weight="700" fill="#4a5568" text-anchor="middle">systole</text>
    <text x="393" y="138" font-size="13" font-weight="700" fill="#4a5568" text-anchor="middle">Diastole</text>

    <!-- ECG -->
    <text x="14" y="90" font-size="14" font-weight="700" fill="#1f3a5f">ECG</text>
    <path d="M62 85 H112
             Q121 66 130 85
             H158 L163 92 L168 34 L175 98 L181 85
             H244 Q264 64 284 85
             H424 Q433 66 442 85
             H468 L473 92 L478 34 L485 98 L491 85
             H648"
          fill="none" stroke="#1a1d21" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="118" y="60" font-size="12.5" fill="#1a1d21">P</text>
    <text x="172" y="32" font-size="12.5" fill="#1a1d21">R</text>
    <text x="258" y="58" font-size="12.5" fill="#1a1d21">T</text>

    <!-- right atrial pressure -->
    <text x="14" y="216" font-size="14" font-weight="700" fill="#1f3a5f">RA</text>
    <path d="M62 214
             C 100 214, 116 178, 140 178
             C 158 178, 160 204, 172 204
             C 180 204, 182 190, 190 190
             C 205 190, 212 224, 232 224
             C 258 224, 262 184, 292 184
             C 316 184, 322 222, 340 222
             C 372 222, 392 214, 430 212
             C 452 210, 456 178, 478 178
             C 496 178, 498 204, 510 204
             C 520 204, 524 192, 532 192
             C 548 192, 556 224, 578 224
             C 606 224, 620 214, 648 212"
          fill="none" stroke="#c0392b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- wave labels -->
    <text x="134" y="168" font-size="13" font-weight="700" fill="#1a1d21">a</text>
    <text x="186" y="180" font-size="13" font-weight="700" fill="#1a1d21">c</text>
    <text x="226" y="242" font-size="13" font-weight="700" fill="#1a1d21">x</text>
    <text x="288" y="174" font-size="13" font-weight="700" fill="#1a1d21">v</text>
    <text x="336" y="242" font-size="13" font-weight="700" fill="#1a1d21">y</text>
    <text x="472" y="168" font-size="13" font-weight="700" fill="#1a1d21">a</text>

    <text x="62" y="274" font-size="12" fill="#5a626b">a, atrial contraction &#183; c, tricuspid closure &#183; x, atrial relaxation</text>
    <text x="62" y="290" font-size="12" fill="#5a626b">v, filling against a closed tricuspid valve &#183; y, early diastolic emptying</text>
  </g>
</svg>
