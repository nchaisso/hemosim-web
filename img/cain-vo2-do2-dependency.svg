<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400" role="img"
     aria-labelledby="cainTitle cainDesc" font-family="Helvetica, Arial, sans-serif">
  <title id="cainTitle">Oxygen consumption (VO2) and oxygen delivery (DO2) dependency</title>
  <desc id="cainDesc">Plot of oxygen consumption against oxygen delivery. VO2 stays flat and independent
  of DO2 above a critical delivery threshold of about 400, then falls in step with delivery below it.
  The oxygen extraction ratio rises as delivery falls until it maxes out at that critical point, central
  venous saturation falls in parallel, and lactate rises steeply once delivery drops below the threshold.</desc>

  <defs>
    <marker id="cainArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1d21"/>
    </marker>
    <style>
      .sub { font-size: 0.62em; }
      .ttl { font-size: 24px; font-weight: 700; fill: #1a1d21; }
      .ax  { font-size: 19px; font-weight: 700; }
      .cur { font-size: 17px; font-weight: 700; }
      .tik { font-size: 15px; fill: #1a1d21; }
      .ann { font-size: 15px; fill: #1a1d21; }
    </style>
  </defs>

  <rect width="750" height="400" fill="#fff"/>

  <!-- title -->
  <text class="ttl" x="375" y="30" text-anchor="middle">Oxygen consumption (VO<tspan class="sub" dy="5">2</tspan><tspan dy="-5">)/Oxygen delivery (DO</tspan><tspan class="sub" dy="5">2</tspan><tspan dy="-5">)</tspan></text>
  <text class="ttl" x="375" y="62" text-anchor="middle">dependency</text>

  <!-- plot frame: heavy, open at the top, as in the source figure -->
  <path d="M 115 88 L 115 332 L 645 332 L 645 88" fill="none" stroke="#1a1d21" stroke-width="7"/>

  <!-- axis titles -->
  <text class="ax" x="106" y="110" text-anchor="end" fill="#1a1d21">VO<tspan class="sub" dy="5">2</tspan></text>
  <text class="ax" x="662" y="110" fill="#7B3F00">ERO<tspan class="sub" dy="5">2</tspan></text>
  <text class="ax" x="624" y="364" fill="#1f7a4d">DO<tspan class="sub" dy="5">2</tspan></text>

  <!-- left axis tick: VO2 = 250 -->
  <line x1="104" y1="207" x2="115" y2="207" stroke="#1a1d21" stroke-width="3"/>
  <text class="tik" x="98" y="212" text-anchor="end">250</text>

  <!-- right axis ticks: extraction ratio -->
  <g stroke="#1a1d21" stroke-width="3">
    <line x1="645" y1="152" x2="656" y2="152"/>
    <line x1="645" y1="207" x2="656" y2="207"/>
    <line x1="645" y1="262" x2="656" y2="262"/>
  </g>
  <g class="tik" font-size="14">
    <text x="662" y="157">75%</text>
    <text x="662" y="212">50%</text>
    <text x="662" y="267">25%</text>
  </g>

  <!-- bottom axis ticks: DO2 -->
  <g stroke="#1a1d21" stroke-width="3">
    <line x1="150" y1="332" x2="150" y2="342"/>
    <line x1="321" y1="332" x2="321" y2="342"/>
    <line x1="364" y1="332" x2="364" y2="342"/>
    <line x1="577" y1="332" x2="577" y2="342"/>
  </g>
  <g class="tik" text-anchor="middle">
    <text x="150" y="360">0</text>
    <text x="321" y="360">400</text>
    <text x="364" y="360">500</text>
    <text x="577" y="360">1000</text>
  </g>

  <!-- critical DO2 drop line -->
  <line x1="321" y1="207" x2="321" y2="332" stroke="#1a1d21" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- VO2: supply-dependent below the critical threshold, independent above it -->
  <line x1="150" y1="316" x2="321" y2="207" stroke="#1f7a4d" stroke-width="4" stroke-dasharray="9 7"/>
  <line x1="321" y1="207" x2="577" y2="207" stroke="#1f7a4d" stroke-width="5"/>
  <rect x="434" y="176" width="66" height="27" rx="4" fill="#fff" stroke="#1f7a4d" stroke-width="2"/>
  <text class="cur" x="467" y="195" text-anchor="middle" fill="#1f7a4d">VO<tspan class="sub" dy="4">2</tspan></text>

  <!-- central venous saturation -->
  <path d="M 160 281 C 214 259 268 227 321 202 C 378 176 432 161 500 154 C 528 151 550 150 566 149"
        fill="none" stroke="#2B6CB0" stroke-width="4.5"/>
  <text class="cur" x="452" y="142" fill="#2B6CB0">ScvO<tspan class="sub" dy="4">2</tspan></text>

  <!-- oxygen extraction ratio: dashed where extraction is already maximal -->
  <path d="M 185 112 C 232 117 277 141 321 172" fill="none" stroke="#7B3F00"
        stroke-width="4.5" stroke-dasharray="9 7"/>
  <path d="M 321 172 C 382 206 452 239 540 255 C 570 260 596 262 616 263"
        fill="none" stroke="#7B3F00" stroke-width="4.5"/>
  <text class="cur" x="588" y="245" fill="#7B3F00">ERO<tspan class="sub" dy="4">2</tspan></text>

  <!-- lactate -->
  <path d="M 248 95 C 259 152 276 222 301 276 C 316 306 331 323 346 331"
        fill="none" stroke="#7B2FBE" stroke-width="4.5"/>
  <text class="cur" x="356" y="311" fill="#7B2FBE">Lactate</text>

  <!-- annotations -->
  <text class="ann" x="437" y="100" text-anchor="middle">Critical ERO<tspan class="sub" dy="4">2</tspan></text>
  <line x1="399" y1="107" x2="337" y2="166" stroke="#1a1d21" stroke-width="2" marker-end="url(#cainArrow)"/>

  <text class="ann" x="393" y="256" text-anchor="middle">Critical DO<tspan class="sub" dy="4">2</tspan></text>
  <line x1="358" y1="248" x2="329" y2="218" stroke="#1a1d21" stroke-width="2" marker-end="url(#cainArrow)"/>
</svg>
