<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-labelledby="rvwf-title rvwf-desc">
<title id="rvwf-title">Right ventricular pressure waveform</title>
<desc id="rvwf-desc">Three cardiac cycles of a right ventricular pressure tracing. Each beat shows a steep systolic upstroke to a rounded systolic peak below 30 mmHg, a steep fall during isovolumic relaxation to an early diastolic minimum, then rapid ventricular filling, slow filling, and a small a wave at end diastole, with an end-diastolic pressure in the same range as right atrial pressure.</desc>
