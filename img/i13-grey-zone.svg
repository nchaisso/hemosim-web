<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="700" height="330" fill="#ffffff"/>
  <text x="350" y="24" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f3a5f">The same index, the same statistics, two different populations</text>

  <!-- scale mapping: PPV 0 to 25 % maps to x 70 to 630, so 22.4 px per % -->

  <!-- panel 1: operating room -->
  <text x="70" y="66" font-size="13" font-weight="700" fill="#1a1d21">Operating room, general anaesthesia, 413 patients</text>
  <text x="70" y="83" font-size="12" fill="#5a626b">Area under the curve 0.89. Grey zone 9 to 13 percent, containing 24 percent of patients.</text>
  <rect x="70" y="96" width="560" height="26" fill="#f4f6f9" stroke="#c3cede"/>
  <rect x="70" y="96" width="201.6" height="26" fill="#e6f0e9"/>
  <rect x="271.6" y="96" width="89.6" height="26" fill="#b9bec6"/>
  <rect x="361.2" y="96" width="268.8" height="26" fill="#f7e6e3"/>
  <text x="170" y="113" text-anchor="middle" font-size="11.5" fill="#2d5c3e">test says no</text>
  <text x="316" y="113" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b3138">grey zone</text>
  <text x="490" y="113" text-anchor="middle" font-size="11.5" fill="#8a3226">test says yes</text>

  <!-- panel 2: ICU -->
  <text x="70" y="170" font-size="13" font-weight="700" fill="#1a1d21">Intensive care unit, nine centres, 556 patients</text>
  <text x="70" y="187" font-size="12" fill="#5a626b">Area under the curve 0.73. Grey zone 4 to 17 percent, containing 62 percent of patients.</text>
  <rect x="70" y="200" width="560" height="26" fill="#f4f6f9" stroke="#c3cede"/>
  <rect x="70" y="200" width="89.6" height="26" fill="#e6f0e9"/>
  <rect x="159.6" y="200" width="291.2" height="26" fill="#b9bec6"/>
  <rect x="450.8" y="200" width="179.2" height="26" fill="#f7e6e3"/>
  <text x="115" y="217" text-anchor="middle" font-size="11" fill="#2d5c3e">no</text>
  <text x="305" y="217" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b3138">grey zone</text>
  <text x="540" y="217" text-anchor="middle" font-size="11.5" fill="#8a3226">test says yes</text>

  <!-- axis -->
  <line x1="70" y1="248" x2="630" y2="248" stroke="#5a626b" stroke-width="1.5"/>
  <g font-size="11" fill="#5a626b" text-anchor="middle">
    <line x1="70" y1="248" x2="70" y2="254" stroke="#5a626b"/><text x="70" y="268">0</text>
    <line x1="182" y1="248" x2="182" y2="254" stroke="#5a626b"/><text x="182" y="268">5</text>
    <line x1="294" y1="248" x2="294" y2="254" stroke="#5a626b"/><text x="294" y="268">10</text>
    <line x1="406" y1="248" x2="406" y2="254" stroke="#5a626b"/><text x="406" y="268">15</text>
    <line x1="518" y1="248" x2="518" y2="254" stroke="#5a626b"/><text x="518" y="268">20</text>
    <line x1="630" y1="248" x2="630" y2="254" stroke="#5a626b"/><text x="630" y="268">25</text>
  </g>
  <text x="350" y="286" text-anchor="middle" font-size="12" fill="#5a626b">Pulse pressure variation, percent</text>

  <!-- the classical cutoff -->
  <line x1="350" y1="90" x2="350" y2="248" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="350" y="310" text-anchor="middle" font-size="12" fill="#c0392b">The pooled 12.5 percent cutoff sits inside both grey zones.</text>
</svg>
