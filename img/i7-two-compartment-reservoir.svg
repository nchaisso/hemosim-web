<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="f" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5a626b"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#00753A"/></marker>
  </defs>
  <rect width="700" height="330" fill="#ffffff"/>

  <!-- inlet -->
  <rect x="14" y="128" width="86" height="66" rx="6" fill="#fdeeec" stroke="#c0392b"/>
  <text x="57" y="152" font-size="11.5" font-weight="700" fill="#c0392b" text-anchor="middle">capillary</text>
  <text x="57" y="167" font-size="11.5" font-weight="700" fill="#c0392b" text-anchor="middle">outflow</text>
  <text x="57" y="184" font-size="10.5" fill="#5a626b" text-anchor="middle">Interface II ends</text>

  <path d="M100 150 L130 150 L130 74 L172 74" fill="none" stroke="#5a626b" stroke-width="1.6" marker-end="url(#f)"/>
  <path d="M100 172 L130 172 L130 240 L172 240" fill="none" stroke="#5a626b" stroke-width="1.6" marker-end="url(#f)"/>

  <!-- splanchnic compartment, drawn large -->
  <rect x="178" y="30" width="300" height="94" rx="8" fill="#eef6f5" stroke="#16706B" stroke-width="1.8"/>
  <text x="194" y="52" font-size="13" font-weight="700" fill="#16706B">Splanchnic veins: liver, gut, spleen</text>
  <text x="194" y="72" font-size="11.5" fill="#3f4650">High compliance, large unstressed volume</text>
  <text x="194" y="90" font-size="11.5" fill="#3f4650">Slow to drain, so it behaves as a reservoir</text>
  <text x="194" y="108" font-size="11.5" font-weight="700" fill="#00753A">This is the recruitable compartment</text>

  <!-- non-splanchnic compartment, drawn small -->
  <rect x="178" y="212" width="300" height="58" rx="8" fill="#f4f6f9" stroke="#1f3a5f" stroke-width="1.8"/>
  <text x="194" y="234" font-size="13" font-weight="700" fill="#1f3a5f">Non-splanchnic veins: muscle, skin, kidney</text>
  <text x="194" y="254" font-size="11.5" fill="#3f4650">Lower compliance, fast to drain, little reserve to give</text>

  <!-- venoconstriction arrow -->
  <line x1="196" y1="164" x2="196" y2="130" stroke="#00753A" stroke-width="2" marker-end="url(#g)"/>
  <text x="208" y="158" font-size="11.5" font-weight="700" fill="#00753A">sympathetic venoconstriction acts mainly here,</text>
  <text x="208" y="175" font-size="11" fill="#5a626b">shifting unstressed volume into the stressed compartment</text>

  <!-- outlet -->
  <path d="M478 74 L520 74 L520 150 L556 150" fill="none" stroke="#5a626b" stroke-width="1.6" marker-end="url(#f)"/>
  <path d="M478 240 L520 240 L520 172 L556 172" fill="none" stroke="#5a626b" stroke-width="1.6" marker-end="url(#f)"/>
  <rect x="562" y="128" width="124" height="66" rx="6" fill="#eaf6ee" stroke="#00753A"/>
  <text x="624" y="152" font-size="11.5" font-weight="700" fill="#00753A" text-anchor="middle">venae cavae</text>
  <text x="624" y="167" font-size="11.5" font-weight="700" fill="#00753A" text-anchor="middle">and right atrium</text>
  <text x="624" y="184" font-size="10.5" fill="#5a626b" text-anchor="middle">where the resistance sits</text>

  <text x="14" y="308" font-size="11.5" fill="#5a626b">The two beds are in parallel, so the share of cardiac output sent to each one changes how fast the reservoir as a whole drains.</text>
</svg>
