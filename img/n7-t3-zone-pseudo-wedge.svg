    <text x="22.0" y="129.0" font-size="12" fill="#1f3a5f" text-anchor="start" font-weight="bold">Wedge</text>
    <text x="286.5" y="164.4" font-size="11.5" fill="#c0392b" text-anchor="middle" font-weight="bold">smooth: no a wave, no v wave</text>
    <text x="70.0" y="228.0" font-size="11.5" fill="#4a5568" text-anchor="start" font-weight="normal">Alveolar pressure exceeds pulmonary venous pressure in that region, the capillary is squeezed shut, and</text>
    <text x="70.0" y="243.0" font-size="11.5" fill="#4a5568" text-anchor="start" font-weight="normal">the static column no longer reaches the left atrium. The tip is reading lung.</text>
    <text x="70.0" y="261.0" font-size="11.5" fill="#4a5568" text-anchor="start" font-weight="normal">Clues: loss of a and v waves, an exaggerated respiratory swing, and a wedge above the PA diastolic</text>
    <text x="70.0" y="276.0" font-size="11.5" fill="#4a5568" text-anchor="start" font-weight="normal">pressure. High PEEP, diuresis and bleeding all convert zone 3 into zone 2 without the catheter moving.</text>
    <text x="70.0" y="294.0" font-size="11.5" fill="#4a5568" text-anchor="start" font-weight="normal">Reposition to a dependent branch, or read the PA diastolic pressure instead.</text>
  </g>
</svg>
