<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-labelledby="t d">
  <title id="t">A pseudo-wedge from a catheter tip in West zone 1 or 2 on positive pressure ventilation</title>
  <desc id="d">A wedge pressure tracing over ten seconds in a ventilated patient with the inspiratory phases shaded. The trace is unnaturally smooth with no a or v waves and swings by more than 10 mmHg with each delivered breath, rising during inspiration. A dashed line marks the pulmonary artery diastolic pressure at 14 mmHg; the wedge trace sits above it for most of the cycle. The value tracks airway pressure rather than left atrial pressure.</desc>
  <!-- Topic 3 questions 4 and 18. Compare with the respiratory timing figure: a true zone 3 wedge keeps its a and v waves and swings far less. -->
