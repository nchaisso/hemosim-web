<text x="52" y="24" font-size="13" font-weight="700" fill="#1f3a5f">CVP</text>
<text x="52" y="294" font-size="12" fill="#5a626b">The respiratory swing moves in opposite directions in the two modes, and the reading point moves with it.</text>
<text x="52" y="310" font-size="12" fill="#5a626b">Both marked beats sit at the same pressure, because both are read where pleural pressure has returned to rest.</text>
