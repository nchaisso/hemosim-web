<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" width="660" height="320" role="img" aria-labelledby="eer-t eer-d">
<title id="eer-t">Where to read a central venous pressure across the respiratory cycle</title>
<desc id="eer-d">Two panels, each showing several cardiac cycles of a central venous pressure trace superimposed on a slow respiratory baseline drift. In the left panel the patient is breathing spontaneously, the baseline falls during inspiration, and end expiration is the highest point of the respiratory excursion. In the right panel the patient is receiving positive pressure ventilation, the baseline rises during inspiration, and end expiration is the lowest point of the respiratory excursion. In both panels the reading point is marked at end expiration, at the base of the c wave, and both reading points fall at the same pressure.</desc>
