<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="gA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c0392b"/><stop offset="1" stop-color="#2b4d7a"/>
    </linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c0392b"/><stop offset="1" stop-color="#8e3a5e"/>
    </linearGradient>
    <linearGradient id="gC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c0392b"/><stop offset="1" stop-color="#b03b3a"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a626b"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#faf9f7"/>

  <!-- ================= PANEL A ================= -->
  <g transform="translate(10,0)">
    <text x="140" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1f3a5f">Homogeneous flow</text>
    <text x="140" y="42" text-anchor="middle" font-size="12.5" fill="#5a626b">four units, equal share</text>
    <!-- feeding arteriole -->
    <path d="M14 70 L14 190" stroke="#c0392b" stroke-width="9" stroke-linecap="round"/>
    <path d="M6 130 L14 130" stroke="#c0392b" stroke-width="9" stroke-linecap="round"/>
    <!-- draining venule -->
    <path d="M254 70 L254 190" stroke="#2b4d7a" stroke-width="9" stroke-linecap="round"/>
    <path d="M254 130 L266 130" stroke="#2b4d7a" stroke-width="9" stroke-linecap="round"/>
    <!-- capillaries -->
    <g>
      <rect x="18" y="64" width="232" height="12" rx="6" fill="url(#gA)"/>
      <rect x="18" y="104" width="232" height="12" rx="6" fill="url(#gA)"/>
      <rect x="18" y="144" width="232" height="12" rx="6" fill="url(#gA)"/>
      <rect x="18" y="184" width="232" height="12" rx="6" fill="url(#gA)"/>
    </g>
    <!-- consumption arrows -->
    <g stroke="#5a626b" stroke-width="1.4" marker-end="url(#ar)">
      <path d="M134 78 L134 94"/><path d="M134 118 L134 134"/><path d="M134 158 L134 174"/><path d="M134 198 L134 214"/>
    </g>
    <text x="140" y="234" text-anchor="middle" font-size="12" fill="#5a626b">every unit extracts 25</text>
    <!-- stats -->
    <rect x="10" y="252" width="260" height="118" rx="6" fill="#fff" stroke="#e4e1db"/>
    <text x="24" y="274" font-size="13" fill="#5a626b">Total flow</text><text x="256" y="274" text-anchor="end" font-size="13.5" font-weight="700" fill="#1a1d21">4 units</text>
    <text x="24" y="300" font-size="13" fill="#5a626b">Perfused capillaries</text><text x="256" y="300" text-anchor="end" font-size="13.5" font-weight="700" fill="#1a1d21">4 of 4</text>
    <text x="24" y="326" font-size="13" fill="#5a626b">Venous saturation</text><text x="256" y="326" text-anchor="end" font-size="13.5" font-weight="700" fill="#2b4d7a">75 %</text>
    <text x="24" y="352" font-size="13" fill="#5a626b">Oxygen consumed</text><text x="256" y="352" text-anchor="end" font-size="13.5" font-weight="700" fill="#1f3a5f">100</text>
  </g>

  <!-- ================= PANEL B ================= -->
  <g transform="translate(310,0)">
    <text x="140" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1f3a5f">Heterogeneous flow</text>
    <text x="140" y="42" text-anchor="middle" font-size="12.5" fill="#5a626b">same total flow, two units stopped</text>
    <path d="M14 70 L14 190" stroke="#c0392b" stroke-width="9" stroke-linecap="round"/>
    <path d="M6 130 L14 130" stroke="#c0392b" stroke-width="9" stroke-linecap="round"/>
    <path d="M254 70 L254 190" stroke="#2b4d7a" stroke-width="9" stroke-linecap="round"/>
    <path d="M254 130 L266 130" stroke="#2b4d7a" stroke-width="9" stroke-linecap="round"/>
    <rect x="18" y="64" width="232" height="12" rx="6" fill="url(#gB)"/>
    <rect x="18" y="104" width="232" height="12" rx="6" fill="#fff" stroke="#b9b3a9" stroke-width="1.4" stroke-dasharray="5 4"/>
    <rect x="18" y="144" width="232" height="12" rx="6" fill="url(#gB)"/>
    <rect x="18" y="184" width="232" height="12" rx="6" fill="#fff" stroke="#b9b3a9" stroke-width="1.4" stroke-dasharray="5 4"/>
    <g stroke="#5a626b" stroke-width="1.4" marker-end="url(#ar)">
      <path d="M134 78 L134 94"/><path d="M134 158 L134 174"/>
    </g>
    <g fill="#8a8378" font-size="11.5">
      <text x="140" y="132" text-anchor="middle">no flow, no exchange</text>
      <text x="140" y="212" text-anchor="middle">no flow, no exchange</text>
    </g>
    <text x="140" y="234" text-anchor="middle" font-size="12" fill="#5a626b">open units still extract 25 each</text>
    <rect x="10" y="252" width="260" height="118" rx="6" fill="#fff" stroke="#e4e1db"/>
    <text x="24" y="274" font-size="13" fill="#5a626b">Total flow</text><text x="256" y="274" text-anchor="end" font-size="13.5" font-weight="700" fill="#1a1d21">4 units</text>
    <text x="24" y="300" font-size="13" fill="#5a626b">Perfused capillaries</text><text x="256" y="300" text-anchor="end" font-size="13.5" font-weight="700" fill="#c0392b">2 of 4</text>
    <text x="24" y="326" font-size="13" fill="#5a626b">Venous saturation</text><text x="256" y="326" text-anchor="end" font-size="13.5" font-weight="700" fill="#c0392b">87.5 %</text>
    <text x="24" y="352" font-size="13" fill="#5a626b">Oxygen consumed</text><text x="256" y="352" text-anchor="end" font-size="13.5" font-weight="700" fill="#c0392b">50</text>
  </g>

  <!-- ================= PANEL C ================= -->
  <g transform="translate(610,0)">
    <text x="140" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1f3a5f">Flow doubled, no recruitment</text>
    <text x="140" y="42" text-anchor="middle" font-size="12.5" fill="#5a626b">all of it through the open units</text>
    <path d="M14 70 L14 190" stroke="#c0392b" stroke-width="13" stroke-linecap="round"/>
    <path d="M4 130 L14 130" stroke="#c0392b" stroke-width="13" stroke-linecap="round"/>
    <path d="M254 70 L254 190" stroke="#2b4d7a" stroke-width="13" stroke-linecap="round"/>
    <path d="M254 130 L268 130" stroke="#2b4d7a" stroke-width="13" stroke-linecap="round"/>
    <rect x="18" y="62" width="232" height="16" rx="8" fill="url(#gC)"/>
    <rect x="18" y="104" width="232" height="12" rx="6" fill="#fff" stroke="#b9b3a9" stroke-width="1.4" stroke-dasharray="5 4"/>
    <rect x="18" y="142" width="232" height="16" rx="8" fill="url(#gC)"/>
    <rect x="18" y="184" width="232" height="12" rx="6" fill="#fff" stroke="#b9b3a9" stroke-width="1.4" stroke-dasharray="5 4"/>
    <g stroke="#5a626b" stroke-width="1.4" marker-end="url(#ar)">
      <path d="M134 80 L134 94"/><path d="M134 160 L134 174"/>
    </g>
    <g fill="#8a8378" font-size="11.5">
      <text x="140" y="132" text-anchor="middle">still no flow</text>
      <text x="140" y="212" text-anchor="middle">still no flow</text>
    </g>
    <text x="140" y="234" text-anchor="middle" font-size="12" fill="#5a626b">extraction per unit is unchanged</text>
    <rect x="10" y="252" width="260" height="118" rx="6" fill="#fff" stroke="#e4e1db"/>
    <text x="24" y="274" font-size="13" fill="#5a626b">Total flow</text><text x="256" y="274" text-anchor="end" font-size="13.5" font-weight="700" fill="#1a1d21">8 units</text>
    <text x="24" y="300" font-size="13" fill="#5a626b">Perfused capillaries</text><text x="256" y="300" text-anchor="end" font-size="13.5" font-weight="700" fill="#c0392b">2 of 4</text>
    <text x="24" y="326" font-size="13" fill="#5a626b">Venous saturation</text><text x="256" y="326" text-anchor="end" font-size="13.5" font-weight="700" fill="#c0392b">93.8 %</text>
    <text x="24" y="352" font-size="13" fill="#5a626b">Oxygen consumed</text><text x="256" y="352" text-anchor="end" font-size="13.5" font-weight="700" fill="#c0392b">50</text>
  </g>

  <text x="450" y="404" text-anchor="middle" font-size="13" fill="#1a1d21">The venous sample is a flow-weighted average, so a unit with no flow contributes nothing to it.</text>
  <text x="450" y="422" text-anchor="middle" font-size="13" fill="#1a1d21">Consumption halves, the saturation rises, and raising total flow makes the number look better still.</text>
</svg>
