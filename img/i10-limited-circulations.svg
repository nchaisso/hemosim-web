<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="940" height="360" fill="#ffffff"/>

  <!-- ============ A: cardiac limited ============ -->
  <text x="42" y="26" font-size="14.5" font-weight="700" fill="#1a1d21">A. Cardiac limited</text>
  <text x="42" y="44" font-size="12" fill="#5a626b">the operating point sits on the flat top</text>
  <text x="42" y="60" font-size="12" fill="#5a626b">of the cardiac function curve</text>
  <line x1="50" y1="260" x2="300" y2="260" stroke="#1a1d21" stroke-width="1.8"/>
  <line x1="50" y1="260" x2="50" y2="86" stroke="#1a1d21" stroke-width="1.8"/>
  <path d="M42 260 C 72 250 98 214 118 180 C 128 160 132 150 146 150 L 292 150" fill="none" stroke="#A8034F" stroke-width="3"/>
  <line x1="242" y1="260" x2="100" y2="90" stroke="#00B0F0" stroke-width="2.4" stroke-opacity="0.40"/>
  <line x1="288" y1="260" x2="146" y2="90" stroke="#00B0F0" stroke-width="3"/>
  <circle cx="150" cy="150" r="5" fill="#8d939a"/>
  <circle cx="196" cy="150" r="6" fill="#1a1d21"/>
  <line x1="159" y1="150" x2="185" y2="150" stroke="#1a1d21" stroke-width="1.6"/>
  <polygon points="189,150 181,146 181,154" fill="#1a1d21"/>
  <text x="60" y="292" font-size="12" fill="#1a1d21">Raise P<tspan font-size="9.5" dy="3">msf</tspan><tspan dy="-3"> or drop R</tspan><tspan font-size="9.5" dy="3">VR</tspan><tspan dy="-3">:</tspan></text>
  <text x="60" y="310" font-size="12" font-weight="700" fill="#0083B4">P<tspan font-size="9.5" dy="3">RA</tspan><tspan dy="-3"> rises, flow does not</tspan></text>
  <text x="60" y="330" font-size="11.5" fill="#5a626b">This is preload unresponsiveness.</text>

  <!-- ============ B: neither ============ -->
  <text x="362" y="26" font-size="14.5" font-weight="700" fill="#1a1d21">B. Neither limit reached</text>
  <text x="362" y="44" font-size="12" fill="#5a626b">the operating point sits on the sloping</text>
  <text x="362" y="60" font-size="12" fill="#5a626b">part of both curves</text>
  <line x1="370" y1="260" x2="620" y2="260" stroke="#1a1d21" stroke-width="1.8"/>
  <line x1="370" y1="260" x2="370" y2="86" stroke="#1a1d21" stroke-width="1.8"/>
  <path d="M362 260 C 396 230 428 176 452 130 C 470 108 484 104 502 104 L 612 104" fill="none" stroke="#A8034F" stroke-width="3"/>
  <line x1="539" y1="260" x2="400" y2="151" stroke="#00B0F0" stroke-width="2.4" stroke-opacity="0.40"/>
  <line x1="580" y1="260" x2="400" y2="119" stroke="#00B0F0" stroke-width="3"/>
  <circle cx="428" cy="173" r="5" fill="#8d939a"/>
  <circle cx="441" cy="151" r="6" fill="#1a1d21"/>
  <line x1="432" y1="166" x2="437" y2="160" stroke="#1a1d21" stroke-width="1.6"/>
  <polygon points="439,157 433,163 440,165" fill="#1a1d21"/>
  <text x="380" y="292" font-size="12" fill="#1a1d21">All four independent variables</text>
  <text x="380" y="310" font-size="12" font-weight="700" fill="#A8034F">move flow, and P<tspan font-size="9.5" dy="3">RA</tspan><tspan dy="-3"> as well</tspan></text>
  <text x="380" y="330" font-size="11.5" fill="#5a626b">This is where most patients live.</text>

  <!-- ============ C: venous limited ============ -->
  <text x="682" y="26" font-size="14.5" font-weight="700" fill="#1a1d21">C. Venous limited</text>
  <text x="682" y="44" font-size="12" fill="#5a626b">the operating point sits on the flat left</text>
  <text x="682" y="60" font-size="12" fill="#5a626b">segment of the venous return curve</text>
  <line x1="690" y1="260" x2="930" y2="260" stroke="#1a1d21" stroke-width="1.8"/>
  <line x1="690" y1="260" x2="690" y2="86" stroke="#1a1d21" stroke-width="1.8"/>
  <path d="M912 260 L 790 172 L 698 172" fill="none" stroke="#00B0F0" stroke-width="3"/>
  <line x1="700" y1="260" x2="800" y2="134" stroke="#A8034F" stroke-width="2.4" stroke-opacity="0.40"/>
  <line x1="700" y1="260" x2="748" y2="119" stroke="#A8034F" stroke-width="3"/>
  <circle cx="770" cy="172" r="5" fill="#8d939a"/>
  <circle cx="730" cy="172" r="6" fill="#1a1d21"/>
  <line x1="761" y1="172" x2="741" y2="172" stroke="#1a1d21" stroke-width="1.6"/>
  <polygon points="737,172 745,168 745,176" fill="#1a1d21"/>
  <text x="700" y="292" font-size="12" fill="#1a1d21">Improve the pump or drop P<tspan font-size="9.5" dy="3">pc</tspan><tspan dy="-3">:</tspan></text>
  <text x="700" y="310" font-size="12" font-weight="700" fill="#0083B4">P<tspan font-size="9.5" dy="3">RA</tspan><tspan dy="-3"> falls, flow does not</tspan></text>
  <text x="700" y="330" font-size="11.5" fill="#5a626b">This is waterfall physiology.</text>
</svg>
