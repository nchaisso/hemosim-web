<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Georgia, serif">
  <rect width="900" height="400" fill="#ffffff"/>

  <!-- ============ PANEL A: coupled ============ -->
  <g transform="translate(0,0)">
    <text x="225" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#12263f">Coupled: E&#8202;a &#247; Ees = 0.5</text>

    <!-- wasted energy triangle: V0(70,320) ESV(170,80) ESV(170,320) -->
    <polygon points="70,320 170,80 170,320" fill="#f0c069" fill-opacity="0.55"/>
    <!-- stroke work area -->
    <path d="M170,80 C230,52 320,54 370,110 L370,306 C320,300 230,300 170,306 Z" fill="#7fbfa8" fill-opacity="0.55"/>

    <!-- axes -->
    <line x1="60" y1="320" x2="410" y2="320" stroke="#12263f" stroke-width="2"/>
    <line x1="60" y1="320" x2="60" y2="45" stroke="#12263f" stroke-width="2"/>
    <text x="235" y="352" text-anchor="middle" font-size="13" fill="#4a4f56">LV volume</text>
    <text x="30" y="185" text-anchor="middle" font-size="13" fill="#4a4f56" transform="rotate(-90 30 185)">LV pressure</text>

    <!-- Ees line, slope 2.2 px per px, from V0(70,320) through ESV(170,80) -->
    <line x1="70" y1="320" x2="182" y2="74" stroke="#c0392b" stroke-width="2.5"/>
    <text x="120" y="150" font-size="13" font-weight="bold" fill="#c0392b" transform="rotate(-66 120 150)">Ees</text>

    <!-- Ea line, slope 1.1, from EDV(370,320) to ESV(170,80) -->
    <line x1="370" y1="320" x2="160" y2="89" stroke="#1b7a5a" stroke-width="2.5"/>
    <text x="290" y="176" font-size="13" font-weight="bold" fill="#1b7a5a" transform="rotate(48 290 176)">Ea</text>

    <!-- PV loop outline -->
    <path d="M370,306 L370,110 C320,54 230,52 170,80 L170,306 C230,300 320,300 370,306 Z" fill="none" stroke="#12263f" stroke-width="2"/>

    <!-- markers -->
    <circle cx="170" cy="80" r="4.5" fill="#12263f"/>
    <line x1="70" y1="320" x2="70" y2="328" stroke="#12263f" stroke-width="2"/>
    <text x="70" y="342" text-anchor="middle" font-size="12" fill="#4a4f56">V<tspan font-size="9" dy="3">0</tspan></text>
    <line x1="170" y1="320" x2="170" y2="328" stroke="#12263f" stroke-width="2"/>
    <text x="170" y="342" text-anchor="middle" font-size="12" fill="#4a4f56">ESV</text>
    <line x1="370" y1="320" x2="370" y2="328" stroke="#12263f" stroke-width="2"/>
    <text x="370" y="342" text-anchor="middle" font-size="12" fill="#4a4f56">EDV</text>

    <!-- stroke volume bracket -->
    <line x1="170" y1="368" x2="370" y2="368" stroke="#4a4f56" stroke-width="1.5"/>
    <line x1="170" y1="363" x2="170" y2="373" stroke="#4a4f56" stroke-width="1.5"/>
    <line x1="370" y1="363" x2="370" y2="373" stroke="#4a4f56" stroke-width="1.5"/>
    <text x="270" y="388" text-anchor="middle" font-size="12.5" fill="#4a4f56">stroke volume</text>

    <text x="112" y="268" font-size="12.5" font-weight="bold" fill="#8a6210">wasted</text>
    <text x="112" y="284" font-size="12.5" font-weight="bold" fill="#8a6210">energy</text>
    <text x="298" y="268" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#12604a">stroke work</text>
  </g>

  <!-- divider -->
  <line x1="450" y1="40" x2="450" y2="360" stroke="#dde2e8" stroke-width="1.5"/>

  <!-- ============ PANEL B: uncoupled ============ -->
  <g transform="translate(460,0)">
    <text x="225" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#12263f">Uncoupled: E&#8202;a &#247; Ees = 2</text>

    <!-- wasted energy triangle: V0(70,320) ESV(270,80) -->
    <polygon points="70,320 270,80 270,320" fill="#f0c069" fill-opacity="0.55"/>
    <!-- stroke work area, narrow -->
    <path d="M270,80 C300,58 350,62 370,110 L370,306 C340,301 300,300 270,306 Z" fill="#7fbfa8" fill-opacity="0.55"/>

    <line x1="60" y1="320" x2="410" y2="320" stroke="#12263f" stroke-width="2"/>
    <line x1="60" y1="320" x2="60" y2="45" stroke="#12263f" stroke-width="2"/>
    <text x="235" y="352" text-anchor="middle" font-size="13" fill="#4a4f56">LV volume</text>

    <!-- Ees line, slope 1.1, V0(70,320) through (270,80) -->
    <line x1="70" y1="320" x2="292" y2="54" stroke="#c0392b" stroke-width="2.5"/>
    <text x="150" y="222" font-size="13" font-weight="bold" fill="#c0392b" transform="rotate(-50 150 222)">Ees</text>

    <!-- Ea line, slope 2.2, EDV(370,320) to (270,80) -->
    <line x1="370" y1="320" x2="262" y2="74" stroke="#1b7a5a" stroke-width="2.5"/>
    <text x="336" y="180" font-size="13" font-weight="bold" fill="#1b7a5a" transform="rotate(66 336 180)">Ea</text>

    <path d="M370,306 L370,110 C350,62 300,58 270,80 L270,306 C300,300 340,301 370,306 Z" fill="none" stroke="#12263f" stroke-width="2"/>

    <circle cx="270" cy="80" r="4.5" fill="#12263f"/>
    <line x1="70" y1="320" x2="70" y2="328" stroke="#12263f" stroke-width="2"/>
    <text x="70" y="342" text-anchor="middle" font-size="12" fill="#4a4f56">V<tspan font-size="9" dy="3">0</tspan></text>
    <line x1="270" y1="320" x2="270" y2="328" stroke="#12263f" stroke-width="2"/>
    <text x="270" y="342" text-anchor="middle" font-size="12" fill="#4a4f56">ESV</text>
    <line x1="370" y1="320" x2="370" y2="328" stroke="#12263f" stroke-width="2"/>
    <text x="370" y="342" text-anchor="middle" font-size="12" fill="#4a4f56">EDV</text>

    <line x1="270" y1="368" x2="370" y2="368" stroke="#4a4f56" stroke-width="1.5"/>
    <line x1="270" y1="363" x2="270" y2="373" stroke="#4a4f56" stroke-width="1.5"/>
    <line x1="370" y1="363" x2="370" y2="373" stroke="#4a4f56" stroke-width="1.5"/>
    <text x="320" y="388" text-anchor="middle" font-size="12.5" fill="#4a4f56">stroke volume</text>

    <text x="140" y="268" font-size="12.5" font-weight="bold" fill="#8a6210">wasted</text>
    <text x="140" y="284" font-size="12.5" font-weight="bold" fill="#8a6210">energy</text>
    <text x="320" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#12604a">stroke</text>
    <text x="320" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#12604a">work</text>
  </g>
</svg>
