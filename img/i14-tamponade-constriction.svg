<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" role="img" aria-labelledby="tc-t tc-d">
<title id="tc-t">Right atrial pressure tracings in tamponade and in constriction</title>
<desc id="tc-d">Three stacked right atrial pressure tracings drawn on a common pressure scale. The normal tracing sits at a low mean pressure with an a wave and a v wave of similar height and with both an x descent and a y descent. The tamponade tracing sits at a markedly elevated mean pressure, retains a deep x descent during ventricular systole, and has no y descent at all, so the trace stays high from the v wave until the next atrial contraction. The constriction tracing also sits at an elevated mean pressure but has both a deep x descent and a very steep y descent followed by an abrupt plateau, producing the characteristic M or W shape. The teaching point is that the mean pressure is the same in the two diseases and only the descents separate them.</desc>
