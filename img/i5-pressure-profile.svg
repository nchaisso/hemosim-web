<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a626b"/>
    </marker>
    <marker id="a2s" markerWidth="9" markerHeight="9" refX="1.5" refY="4.5" orient="auto">
      <path d="M9,0 L0,4.5 L9,9 z" fill="#5a626b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <!-- axes -->
  <line x1="96" y1="46" x2="96" y2="362" stroke="#1a1d21" stroke-width="1.6"/>
  <line x1="96" y1="362" x2="690" y2="362" stroke="#1a1d21" stroke-width="1.6"/>
  <text x="30" y="200" font-size="13" fill="#1a1d21" transform="rotate(-90 30 200)" text-anchor="middle">Pressure (mmHg)</text>

  <!-- y ticks -->
  <g font-size="11.5" fill="#5a626b" text-anchor="end">
    <line x1="90" y1="60" x2="96" y2="60" stroke="#5a626b"/><text x="86" y="64">100</text>
    <line x1="90" y1="135" x2="96" y2="135" stroke="#5a626b"/><text x="86" y="139">75</text>
    <line x1="90" y1="210" x2="96" y2="210" stroke="#5a626b"/><text x="86" y="214">50</text>
    <line x1="90" y1="285" x2="96" y2="285" stroke="#5a626b"/><text x="86" y="289">25</text>
    <line x1="90" y1="360" x2="96" y2="360" stroke="#5a626b"/><text x="86" y="364">0</text>
  </g>

  <!-- guide lines -->
  <line x1="96" y1="81" x2="360" y2="81" stroke="#c0c5cc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="96" y1="223" x2="400" y2="223" stroke="#c0c5cc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="96" y1="304" x2="430" y2="304" stroke="#c0c5cc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="96" y1="345" x2="640" y2="345" stroke="#c0c5cc" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- arterial limb -->
  <path d="M120,81 L215,88 L265,103 L340,223" fill="none" stroke="#C00000" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the waterfall: unknown territory between Pcrit and Pms -->
  <path d="M340,223 C356,250 372,278 400,304" fill="none" stroke="#8a5a8f" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
  <!-- venous limb -->
  <path d="M400,304 L520,322 L640,345" fill="none" stroke="#006B96" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- point markers -->
  <circle cx="120" cy="81" r="5" fill="#C00000"/>
  <circle cx="340" cy="223" r="6" fill="#1a1d21"/>
  <circle cx="400" cy="304" r="6" fill="#1a1d21"/>
  <circle cx="640" cy="345" r="5" fill="#006B96"/>

  <!-- labels on the curve -->
  <text x="126" y="70" font-size="14" font-weight="700" fill="#C00000">MAP 90</text>
  <text x="348" y="216" font-size="14" font-weight="700" fill="#1a1d21">P</text>
  <text x="358" y="220" font-size="10" font-weight="700" fill="#1a1d21">crit</text>
  <text x="382" y="216" font-size="14" font-weight="700" fill="#1a1d21">45</text>
  <text x="408" y="299" font-size="14" font-weight="700" fill="#1a1d21">P</text>
  <text x="417" y="303" font-size="10" font-weight="700" fill="#1a1d21">ms</text>
  <text x="432" y="299" font-size="14" font-weight="700" fill="#1a1d21">19</text>
  <text x="566" y="330" font-size="14" font-weight="700" fill="#006B96">RAP 5</text>

  <!-- TPP bracket -->
  <line x1="112" y1="81" x2="112" y2="223" stroke="#5a626b" stroke-width="1.5" marker-start="url(#a2s)" marker-end="url(#a2)"/>
  <text x="122" y="150" font-size="13" font-weight="700" fill="#3f4650">tissue perfusion</text>
  <text x="122" y="166" font-size="13" font-weight="700" fill="#3f4650">pressure, 45</text>

  <!-- waterfall bracket -->
  <line x1="452" y1="223" x2="452" y2="304" stroke="#8a5a8f" stroke-width="1.5" marker-start="url(#a2s)" marker-end="url(#a2)"/>
  <text x="462" y="256" font-size="13" font-weight="700" fill="#8a5a8f">vascular waterfall, 27</text>
  <text x="462" y="272" font-size="12" fill="#5a626b">no resistance, no flow term</text>

  <!-- venous gradient bracket -->
  <line x1="664" y1="304" x2="664" y2="345" stroke="#006B96" stroke-width="1.3" marker-start="url(#a2s)" marker-end="url(#a2)"/>
  <text x="640" y="292" font-size="12" fill="#006B96" text-anchor="middle">venous gradient, 14</text>

  <!-- resistance spans -->
  <line x1="120" y1="392" x2="340" y2="392" stroke="#C00000" stroke-width="1.4" marker-start="url(#a2s)" marker-end="url(#a2)"/>
  <text x="230" y="386" font-size="12.5" font-weight="700" fill="#C00000" text-anchor="middle">arterial resistance</text>
  <line x1="400" y1="392" x2="640" y2="392" stroke="#006B96" stroke-width="1.4" marker-start="url(#a2s)" marker-end="url(#a2)"/>
  <text x="520" y="386" font-size="12.5" font-weight="700" fill="#006B96" text-anchor="middle">venous resistance</text>

  <!-- x labels -->
  <g font-size="11.5" fill="#5a626b" text-anchor="middle">
    <text x="130" y="418">aorta</text>
    <text x="240" y="418">small arteries</text>
    <text x="340" y="418">arterioles</text>
    <text x="470" y="418">venules</text>
    <text x="620" y="418">right atrium</text>
  </g>
</svg>
