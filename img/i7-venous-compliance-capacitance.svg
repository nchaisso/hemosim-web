<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="i7cc-title i7cc-desc">
  <title id="i7cc-title">Venous compliance and venous capacitance are different properties of one pressure-volume relationship</title>
  <desc id="i7cc-desc">Two panels, each a graph of venous volume against transmural pressure. Panel A, compliance is the slope. Two lines leave the same unstressed volume intercept on the volume axis. The navy line is steeper and is labelled higher compliance, the red line is shallower and is labelled lower compliance, and at one pressure a double-headed arrow marks the difference in volume held. Panel B, venoconstriction mainly changes capacitance. A navy baseline line and a green venoconstriction line have the same slope, but the green line starts from a lower unstressed volume intercept. A horizontal dashed line marks the same total venous volume, which the baseline line reaches at a lower pressure P1 and the venoconstriction line reaches at a higher pressure P2. A legend beneath defines unstressed volume, stressed volume and capacitance, and a closing line states that a vasopressor may raise Pms mainly by decreasing capacitance and recruiting unstressed volume into stressed volume, not necessarily by changing compliance.</desc>

  <!-- Hand drawn for HemoSim I7, 2026-09-13, redrawing a two panel figure
       supplied by Gustavo Garcia in the I7 review, in the site's own style so
       that no dash characters are baked into a raster. -->

  <defs>
    <marker id="i7cc-ax" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5a626b"/></marker>
    <marker id="i7cc-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a1d21"/></marker>
    <marker id="i7cc-arrs" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#1a1d21"/></marker>
  </defs>

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
    <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>

    <!-- ============ Panel A ============ -->
    <rect x="14" y="14" width="428" height="358" fill="none" stroke="#c8cdd4" stroke-width="1"/>
    <rect x="14" y="14" width="428" height="30" fill="#f4f6f9" stroke="#c8cdd4" stroke-width="1"/>
    <text x="228" y="34" font-size="13.5" font-weight="700" fill="#1a1d21" text-anchor="middle">A. Compliance is the slope, &#916;V &#247; &#916;P</text>

    <!-- axes -->
    <line x1="84" y1="320" x2="418" y2="320" stroke="#5a626b" stroke-width="1.4" marker-end="url(#i7cc-ax)"/>
    <line x1="84" y1="320" x2="84" y2="70" stroke="#5a626b" stroke-width="1.4" marker-end="url(#i7cc-ax)"/>
    <text x="252" y="344" font-size="12" fill="#3f4650" text-anchor="middle">transmural pressure (mmHg)</text>
    <text x="0" y="0" font-size="12" fill="#3f4650" transform="translate(40,195) rotate(-90)" text-anchor="middle">venous volume (mL)</text>
    <text x="84" y="336" font-size="11" fill="#5a626b" text-anchor="middle">0</text>

    <!-- shared unstressed volume intercept -->
    <circle cx="84" cy="262" r="4.5" fill="#1a1d21"/>
    <text x="70" y="266" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="end">V<tspan font-size="9" dy="3">u</tspan></text>

    <!-- higher compliance, navy, steeper -->
    <line x1="84" y1="262" x2="380" y2="96" stroke="#1f3a5f" stroke-width="2.4"/>
    <text x="386" y="94" font-size="12" font-weight="700" fill="#1f3a5f">higher</text>
    <text x="386" y="108" font-size="12" font-weight="700" fill="#1f3a5f">compliance</text>

    <!-- lower compliance, red, shallower -->
    <line x1="84" y1="262" x2="380" y2="200" stroke="#c0392b" stroke-width="2.4"/>
    <text x="386" y="198" font-size="12" font-weight="700" fill="#c0392b">lower</text>
    <text x="386" y="212" font-size="12" font-weight="700" fill="#c0392b">compliance</text>

    <!-- P1 marker and the volume difference at that pressure -->
    <line x1="232" y1="320" x2="232" y2="182" stroke="#9aa3af" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="232" y="336" font-size="11.5" font-weight="700" fill="#1f3a5f" text-anchor="middle">P<tspan font-size="9" dy="3">1</tspan></text>
    <circle cx="232" cy="179" r="4.5" fill="#1f3a5f"/>
    <circle cx="232" cy="231" r="4.5" fill="#c0392b"/>
    <line x1="232" y1="186" x2="232" y2="224" stroke="#1a1d21" stroke-width="1.4" marker-start="url(#i7cc-arrs)" marker-end="url(#i7cc-arr)"/>
    <text x="244" y="212" font-size="11" fill="#1a1d21">same pressure,</text>
    <text x="244" y="225" font-size="11" fill="#1a1d21">different volume</text>

    <text x="112" y="296" font-size="11" fill="#5a626b">a more compliant vein accepts more volume</text>
    <text x="112" y="309" font-size="11" fill="#5a626b">for the same change in transmural pressure</text>

    <!-- ============ Panel B ============ -->
    <rect x="458" y="14" width="428" height="358" fill="none" stroke="#c8cdd4" stroke-width="1"/>
    <rect x="458" y="14" width="428" height="30" fill="#f4f6f9" stroke="#c8cdd4" stroke-width="1"/>
    <text x="672" y="34" font-size="13.5" font-weight="700" fill="#1a1d21" text-anchor="middle">B. Venoconstriction mainly changes capacitance</text>

    <!-- axes -->
    <line x1="528" y1="320" x2="862" y2="320" stroke="#5a626b" stroke-width="1.4" marker-end="url(#i7cc-ax)"/>
    <line x1="528" y1="320" x2="528" y2="70" stroke="#5a626b" stroke-width="1.4" marker-end="url(#i7cc-ax)"/>
    <text x="696" y="344" font-size="12" fill="#3f4650" text-anchor="middle">transmural pressure (mmHg)</text>
    <text x="0" y="0" font-size="12" fill="#3f4650" transform="translate(484,195) rotate(-90)" text-anchor="middle">venous volume (mL)</text>
    <text x="528" y="336" font-size="11" fill="#5a626b" text-anchor="middle">0</text>

    <!-- baseline, navy: intercept Vu1, slope 0.5 -->
    <line x1="528" y1="230" x2="808" y2="90" stroke="#1f3a5f" stroke-width="2.4"/>
    <circle cx="528" cy="230" r="4.5" fill="#1f3a5f"/>
    <text x="514" y="234" font-size="12" font-weight="700" fill="#1f3a5f" text-anchor="end">V<tspan font-size="9" dy="3">u1</tspan></text>
    <text x="814" y="92" font-size="12" font-weight="700" fill="#1f3a5f">baseline</text>

    <!-- venoconstriction, green: intercept Vu2 lower, same slope -->
    <line x1="528" y1="290" x2="808" y2="150" stroke="#00753A" stroke-width="2.4"/>
    <circle cx="528" cy="290" r="4.5" fill="#00753A"/>
    <text x="514" y="294" font-size="12" font-weight="700" fill="#00753A" text-anchor="end">V<tspan font-size="9" dy="3">u2</tspan></text>
    <text x="814" y="148" font-size="12" font-weight="700" fill="#00753A">reduced</text>
    <text x="814" y="162" font-size="12" font-weight="700" fill="#00753A">capacitance</text>

    <!-- same total volume Vt: baseline reaches it at P1 (x=648, y=170); green reaches it at P2 (x=768, y=170) -->
    <line x1="528" y1="170" x2="770" y2="170" stroke="#9aa3af" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="514" y="174" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="end">V<tspan font-size="9" dy="3">t</tspan></text>
    <line x1="648" y1="320" x2="648" y2="170" stroke="#9aa3af" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="768" y1="320" x2="768" y2="170" stroke="#9aa3af" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="648" cy="170" r="4.5" fill="#1f3a5f"/>
    <circle cx="768" cy="170" r="4.5" fill="#00753A"/>
    <text x="648" y="336" font-size="11.5" font-weight="700" fill="#1f3a5f" text-anchor="middle">P<tspan font-size="9" dy="3">1</tspan></text>
    <text x="768" y="336" font-size="11.5" font-weight="700" fill="#00753A" text-anchor="middle">P<tspan font-size="9" dy="3">2</tspan></text>
    <line x1="656" y1="196" x2="760" y2="196" stroke="#1a1d21" stroke-width="1.4" marker-end="url(#i7cc-arr)"/>
    <text x="708" y="212" font-size="11" fill="#1a1d21" text-anchor="middle">P<tspan font-size="8.5" dy="3">2</tspan><tspan dy="-3"> &#62; P</tspan><tspan font-size="8.5" dy="3">1</tspan></text>

    <text x="548" y="255" font-size="11" fill="#5a626b">same total venous volume, held at a</text>
    <text x="548" y="268" font-size="11" fill="#5a626b">higher pressure after venoconstriction:</text>
    <text x="548" y="281" font-size="11" fill="#5a626b">unstressed volume has become stressed</text>
    <text x="548" y="294" font-size="11" fill="#5a626b">volume, with no change in slope</text>

    <!-- ============ Legend ============ -->
    <rect x="14" y="386" width="872" height="100" fill="#f4f6f9" stroke="#c8cdd4" stroke-width="1"/>
    <text x="30" y="408" font-size="12" fill="#1a1d21"><tspan font-weight="700">Unstressed volume, V<tspan font-size="9" dy="3">u</tspan><tspan dy="-3">.</tspan></tspan> The volume present at zero transmural pressure. It fills the vessel without stretching it.</text>
    <text x="30" y="428" font-size="12" fill="#1a1d21"><tspan font-weight="700">Stressed volume, V<tspan font-size="9" dy="3">s</tspan><tspan dy="-3">.</tspan></tspan> The volume above V<tspan font-size="9" dy="3">u</tspan><tspan dy="-3">. It stretches the wall and generates the elastic recoil pressure.</tspan></text>
    <text x="30" y="448" font-size="12" fill="#1a1d21"><tspan font-weight="700">Capacitance (Gelman's capacity).</tspan> The total volume contained at a given pressure, V<tspan font-size="9" dy="3">u</tspan><tspan dy="-3"> + V</tspan><tspan font-size="9" dy="3">s</tspan><tspan dy="-3">. It says where the whole line sits.</tspan></text>
    <text x="30" y="474" font-size="12" font-weight="700" fill="#1f3a5f">A vasopressor may raise P<tspan font-size="9" dy="3">ms</tspan><tspan dy="-3"> mainly by decreasing capacitance, recruiting V</tspan><tspan font-size="9" dy="3">u</tspan><tspan dy="-3"> into V</tspan><tspan font-size="9" dy="3">s</tspan><tspan dy="-3">, and not necessarily by changing compliance.</tspan></text>
  </g>
</svg>
