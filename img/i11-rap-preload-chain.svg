<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a626b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="500" fill="#ffffff"/>

  <!-- Step 1 -->
  <rect x="20" y="12" width="310" height="56" rx="6" fill="#f7faf8" stroke="#e4e1db"/>
  <rect x="20" y="12" width="5" height="56" rx="2.5" fill="#00B050"/>
  <text x="38" y="36" font-size="16" font-weight="700" fill="#00753A">Right atrial pressure</text>
  <text x="38" y="55" font-size="11.5" fill="#5a626b">what the transducer reads, against atmosphere</text>

  <line x1="80" y1="68" x2="80" y2="112" stroke="#5a626b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="348" y="82" font-size="12.5" font-weight="700" fill="#c0392b">subtract the pressure outside the heart</text>
  <text x="348" y="99" font-size="12" fill="#3f4650">PEEP, auto-PEEP, inspiratory effort, raised</text>
  <text x="348" y="114" font-size="12" fill="#3f4650">intra-abdominal pressure, a stiff chest wall</text>

  <!-- Step 2 -->
  <rect x="20" y="122" width="310" height="56" rx="6" fill="#fbfbfa" stroke="#e4e1db"/>
  <text x="38" y="146" font-size="16" font-weight="700" fill="#1f3a5f">Transmural filling pressure</text>
  <text x="38" y="165" font-size="11.5" fill="#5a626b">the pressure actually distending the chamber</text>

  <line x1="80" y1="178" x2="80" y2="222" stroke="#5a626b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="348" y="192" font-size="12.5" font-weight="700" fill="#c0392b">divide by chamber compliance</text>
  <text x="348" y="209" font-size="12" fill="#3f4650">not a constant, not linear, not measurable at the</text>
  <text x="348" y="224" font-size="12" fill="#3f4650">bedside, and moved by ischemia, RV dilation,</text>
  <text x="348" y="239" font-size="12" fill="#3f4650">pericardial constraint and tamponade</text>

  <!-- Step 3 -->
  <rect x="20" y="232" width="310" height="56" rx="6" fill="#fbfbfa" stroke="#e4e1db"/>
  <text x="38" y="256" font-size="16" font-weight="700" fill="#1f3a5f">End-diastolic volume</text>
  <text x="38" y="275" font-size="11.5" fill="#5a626b">how much blood the chamber actually holds</text>

  <line x1="80" y1="288" x2="80" y2="332" stroke="#5a626b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="348" y="302" font-size="12.5" font-weight="700" fill="#c0392b">account for chamber geometry</text>
  <text x="348" y="319" font-size="12" fill="#3f4650">hypertrophy, chronic dilation, remodeling</text>

  <!-- Step 4 -->
  <rect x="20" y="342" width="310" height="56" rx="6" fill="#f6f8fb" stroke="#e4e1db"/>
  <rect x="20" y="342" width="5" height="56" rx="2.5" fill="#1f3a5f"/>
  <text x="38" y="366" font-size="16" font-weight="700" fill="#1f3a5f">End-diastolic sarcomere length</text>
  <text x="38" y="385" font-size="11.5" fill="#5a626b">this, and only this, is preload</text>

  <!-- Footer note -->
  <rect x="20" y="418" width="660" height="66" rx="6" fill="#eef2f7" stroke="#cdd6e2"/>
  <text x="36" y="440" font-size="12.5" font-weight="700" fill="#1f3a5f">And RAP is not an input to the circulation.</text>
  <text x="36" y="458" font-size="12" fill="#3f4650">It is the pressure at which the venous return and cardiac function curves happen to cross, so the same</text>
  <text x="36" y="474" font-size="12" fill="#3f4650">value is produced by many different circulations. Reading it backwards to a volume state is a guess.</text>
</svg>
