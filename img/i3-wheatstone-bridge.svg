<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" font-family="Georgia, serif">
  <rect width="620" height="330" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#c9862b"/>
    </marker>
  </defs>

  <!-- ============ LEFT COLUMN ============ -->
  <text x="18" y="24" font-size="13.5" font-weight="bold" fill="#1c3557">1. The diaphragm deflects</text>
  <rect x="18" y="34" width="252" height="96" rx="6" fill="#f4f6f9" stroke="#c7cdd6"/>
  <text x="30" y="52" font-size="10.5" fill="#7a5a20">pressure arriving up the fluid column</text>
  <path d="M32 74 h48" stroke="#c9862b" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M32 104 h48" stroke="#c9862b" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M100 60 q22 29 0 58" fill="none" stroke="#98a1ad" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M100 60 q44 29 0 58" fill="none" stroke="#1c3557" stroke-width="2.6"/>
  <line x1="146" y1="89" x2="166" y2="89" stroke="#1c3557" stroke-width="1"/>
  <text x="172" y="85" font-size="11" fill="#1c3557">strain gauge</text>
  <text x="172" y="100" font-size="11" fill="#1c3557">bonded to it</text>
  <text x="18" y="146" font-size="10.5" fill="#7a7f88">Dashed, resting. Solid, deflected.</text>

  <text x="18" y="178" font-size="13.5" font-weight="bold" fill="#1c3557">2. Deflection changes resistance</text>
  <text x="18" y="198" font-size="11.5" fill="#4a4f56">Two gauge elements are stretched and their</text>
  <text x="18" y="214" font-size="11.5" fill="#4a4f56">resistance rises. Two are compressed and</text>
  <text x="18" y="230" font-size="11.5" fill="#4a4f56">their resistance falls.</text>

  <text x="18" y="260" font-size="13.5" font-weight="bold" fill="#1c3557">3. The bridge turns that into a voltage</text>
  <text x="18" y="280" font-size="11.5" fill="#4a4f56">Matched arms leave the bridge balanced and</text>
  <text x="18" y="296" font-size="11.5" fill="#4a4f56">the output at zero. Any imbalance gives a</text>
  <text x="18" y="312" font-size="11.5" fill="#4a4f56">voltage proportional to the applied pressure.</text>

  <!-- ============ RIGHT: BRIDGE ============ -->
  <g transform="translate(300,18)">
    <rect x="0" y="0" width="302" height="296" rx="8" fill="#fbfcfd" stroke="#c7cdd6"/>
    <!-- diamond: top(151,52) left(56,148) right(246,148) bottom(151,244) -->
    <g stroke="#1c3557" stroke-width="2" fill="none">
      <path d="M151 56 L78 130"/>
      <path d="M151 56 L224 130"/>
      <path d="M78 166 L151 240"/>
      <path d="M224 166 L151 240"/>
    </g>
    <g fill="#ffffff" stroke="#1c3557" stroke-width="2">
      <rect x="98" y="82" width="32" height="20" rx="2" transform="rotate(45 114 92)"/>
      <rect x="172" y="82" width="32" height="20" rx="2" transform="rotate(-45 188 92)"/>
      <rect x="98" y="194" width="32" height="20" rx="2" transform="rotate(-45 114 204)"/>
      <rect x="172" y="194" width="32" height="20" rx="2" transform="rotate(45 188 204)"/>
    </g>
    <text x="94" y="74" font-size="12.5" fill="#C00000" font-weight="bold" text-anchor="end">R rises</text>
    <text x="208" y="74" font-size="12.5" fill="#006B96" font-weight="bold">R falls</text>
    <text x="94" y="230" font-size="12.5" fill="#006B96" font-weight="bold" text-anchor="end">R falls</text>
    <text x="208" y="230" font-size="12.5" fill="#C00000" font-weight="bold">R rises</text>

    <circle cx="151" cy="52" r="4.5" fill="#1c3557"/>
    <circle cx="151" cy="244" r="4.5" fill="#1c3557"/>
    <line x1="151" y1="52" x2="151" y2="32" stroke="#1c3557" stroke-width="2"/>
    <line x1="151" y1="244" x2="151" y2="264" stroke="#1c3557" stroke-width="2"/>
    <text x="151" y="24" font-size="11.5" fill="#1c3557" text-anchor="middle">excitation voltage in</text>
    <text x="151" y="280" font-size="11.5" fill="#1c3557" text-anchor="middle">ground</text>

    <circle cx="56" cy="148" r="4.5" fill="#1c3557"/>
    <circle cx="246" cy="148" r="4.5" fill="#1c3557"/>
    <line x1="56" y1="148" x2="26" y2="148" stroke="#c9862b" stroke-width="2"/>
    <line x1="246" y1="148" x2="276" y2="148" stroke="#c9862b" stroke-width="2"/>
    <text x="151" y="146" font-size="14" fill="#c9862b" font-weight="bold" text-anchor="middle">output voltage</text>
    <text x="151" y="164" font-size="11" fill="#4a4f56" text-anchor="middle">to the amplifier and display</text>
  </g>
</svg>
