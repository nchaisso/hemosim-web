<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="660" height="420" fill="#ffffff"/>

  <polygon points="130,330 250,330 250,130" fill="#A8034F" fill-opacity="0.10"/>
  <polygon points="250,330 490,330 250,130" fill="#00B0F0" fill-opacity="0.12"/>

  <line x1="70" y1="330" x2="620" y2="330" stroke="#1a1d21" stroke-width="2"/>
  <line x1="70" y1="330" x2="70" y2="45" stroke="#1a1d21" stroke-width="2"/>
  <polygon points="620,330 612,326 612,334" fill="#1a1d21"/>
  <polygon points="70,45 66,53 74,53" fill="#1a1d21"/>

  <line x1="130" y1="330" x2="292" y2="60" stroke="#A8034F" stroke-width="3"/>
  <line x1="490" y1="330" x2="166" y2="60" stroke="#00B0F0" stroke-width="3"/>

  <line x1="250" y1="330" x2="250" y2="130" stroke="#1a1d21" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="70" y1="130" x2="250" y2="130" stroke="#1a1d21" stroke-width="1.2" stroke-dasharray="4 4"/>

  <circle cx="250" cy="130" r="7" fill="#1a1d21"/>
  <text x="302" y="102" font-size="14" font-weight="700" fill="#1a1d21">Operating point</text>
  <text x="302" y="120" font-size="12.5" fill="#5a626b">the shared apex of the two triangles</text>

  <line x1="130" y1="326" x2="130" y2="338" stroke="#1a1d21" stroke-width="2"/>
  <line x1="250" y1="326" x2="250" y2="338" stroke="#1a1d21" stroke-width="2"/>
  <line x1="490" y1="326" x2="490" y2="338" stroke="#1a1d21" stroke-width="2"/>
  <text x="130" y="356" font-size="14" text-anchor="middle" fill="#1a1d21">P<tspan font-size="10" dy="4">pc</tspan></text>
  <text x="250" y="356" font-size="14" text-anchor="middle" fill="#1a1d21">P<tspan font-size="10" dy="4">RA</tspan></text>
  <text x="490" y="356" font-size="14" text-anchor="middle" fill="#1a1d21">P<tspan font-size="10" dy="4">msf</tspan></text>

  <path d="M130 374 L130 382 L490 382 L490 374" fill="none" stroke="#5a626b" stroke-width="1.4"/>
  <text x="310" y="402" font-size="13.5" text-anchor="middle" fill="#5a626b">combined base of the two triangles: P<tspan font-size="10" dy="4">msf</tspan><tspan dy="-4"> &#8722; P</tspan><tspan font-size="10" dy="4">pc</tspan></text>

  <text transform="translate(30,220) rotate(-90)" font-size="14" text-anchor="middle" fill="#1a1d21">Flow (L/min)</text>
  <text x="345" y="22" font-size="13.5" text-anchor="middle" fill="#5a626b">Right atrial pressure, referenced to atmosphere</text>

  <line x1="100" y1="330" x2="100" y2="130" stroke="#5a626b" stroke-width="1.2"/>
  <polygon points="100,130 96,140 104,140" fill="#5a626b"/>
  <polygon points="100,330 96,320 104,320" fill="#5a626b"/>
  <text transform="translate(118,240) rotate(-90)" font-size="12.5" text-anchor="middle" fill="#5a626b">height = Q</text>

  <text x="380" y="176" font-size="13.5" font-weight="700" fill="#A8034F">cardiac function</text>
  <text x="380" y="194" font-size="12.5" fill="#A8034F">slope G<tspan font-size="10" dy="4">cardiac</tspan><tspan dy="-4"> = 1 &#247; R</tspan><tspan font-size="10" dy="4">cardiac</tspan></text>
  <text x="88" y="98" font-size="13.5" font-weight="700" fill="#0083B4">venous return</text>
  <text x="88" y="116" font-size="12.5" fill="#0083B4">slope G<tspan font-size="10" dy="4">VR</tspan><tspan dy="-4"> = 1 &#247; R</tspan><tspan font-size="10" dy="4">VR</tspan></text>
</svg>
