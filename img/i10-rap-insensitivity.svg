<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" width="940" height="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="940" height="350" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#1a1d21"/></marker>
  </defs>

  <!-- PANEL A -->
  <text x="70" y="26" font-size="15" font-weight="700" fill="#1a1d21">A. Both functions move</text>
  <text x="70" y="45" font-size="12.5" fill="#5a626b">volume and tone raise P<tspan font-size="9.5" dy="3">msf</tspan><tspan dy="-3">, and the same drug lifts the pump</tspan></text>

  <line x1="70" y1="270" x2="410" y2="270" stroke="#1a1d21" stroke-width="2"/>
  <line x1="70" y1="270" x2="70" y2="62" stroke="#1a1d21" stroke-width="2"/>

  <line x1="270" y1="270" x2="90" y2="141" stroke="#00B0F0" stroke-width="2.4" stroke-opacity="0.40"/>
  <line x1="350" y1="270" x2="118" y2="104" stroke="#00B0F0" stroke-width="3"/>
  <line x1="90" y1="270" x2="190" y2="127" stroke="#A8034F" stroke-width="2.4" stroke-opacity="0.40"/>
  <line x1="90" y1="270" x2="168" y2="108" stroke="#A8034F" stroke-width="3"/>

  <circle cx="150" cy="184" r="5.5" fill="#8d939a"/>
  <circle cx="157" cy="132" r="6.5" fill="#1a1d21"/>
  <line x1="152" y1="176" x2="157" y2="143" stroke="#1a1d21" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="222" y="126" font-size="12.5" fill="#5a626b">solid lines: after</text>
  <text x="222" y="143" font-size="12.5" fill="#5a626b">pale lines: before</text>

  <line x1="70" y1="184" x2="70" y2="132" stroke="#A8034F" stroke-width="7"/>
  <line x1="150" y1="184" x2="76" y2="184" stroke="#8d939a" stroke-width="0.9" stroke-dasharray="3 3"/>
  <line x1="157" y1="132" x2="76" y2="132" stroke="#8d939a" stroke-width="0.9" stroke-dasharray="3 3"/>
  <text x="78" y="90" font-size="13" font-weight="700" fill="#A8034F">flow rises a lot</text>

  <line x1="150" y1="270" x2="150" y2="284" stroke="#8d939a" stroke-width="0.9" stroke-dasharray="3 3"/>
  <line x1="157" y1="270" x2="157" y2="284" stroke="#8d939a" stroke-width="0.9" stroke-dasharray="3 3"/>
  <line x1="150" y1="276" x2="157" y2="276" stroke="#0083B4" stroke-width="7"/>
  <text x="176" y="300" font-size="13" font-weight="700" fill="#0083B4">P<tspan font-size="10" dy="4">RA</tspan><tspan dy="-4"> hardly moves</tspan></text>

  <text transform="translate(38,170) rotate(-90)" font-size="12.5" text-anchor="middle" fill="#1a1d21">Flow</text>
  <text x="386" y="262" font-size="12.5" fill="#1a1d21">P<tspan font-size="10" dy="4">RA</tspan></text>

  <!-- PANEL B -->
  <text x="550" y="26" font-size="15" font-weight="700" fill="#1a1d21">B. One function moves alone</text>
  <text x="550" y="45" font-size="12.5" fill="#5a626b">the pump is depressed and nothing on the venous side changes</text>

  <line x1="550" y1="270" x2="890" y2="270" stroke="#1a1d21" stroke-width="2"/>
  <line x1="550" y1="270" x2="550" y2="62" stroke="#1a1d21" stroke-width="2"/>

  <line x1="750" y1="270" x2="570" y2="141" stroke="#00B0F0" stroke-width="3"/>
  <line x1="570" y1="270" x2="670" y2="127" stroke="#A8034F" stroke-width="2.4" stroke-opacity="0.40"/>
  <line x1="570" y1="270" x2="770" y2="192" stroke="#A8034F" stroke-width="3"/>

  <circle cx="630" cy="184" r="5.5" fill="#8d939a"/>
  <circle cx="686" cy="225" r="6.5" fill="#1a1d21"/>
  <line x1="637" y1="190" x2="679" y2="220" stroke="#1a1d21" stroke-width="1.6" marker-end="url(#ah)"/>

  <line x1="550" y1="184" x2="550" y2="225" stroke="#A8034F" stroke-width="7"/>
  <line x1="630" y1="184" x2="556" y2="184" stroke="#8d939a" stroke-width="0.9" stroke-dasharray="3 3"/>
  <line x1="686" y1="225" x2="556" y2="225" stroke="#8d939a" stroke-width="0.9" stroke-dasharray="3 3"/>
  <text x="566" y="104" font-size="13" font-weight="700" fill="#A8034F">flow falls</text>

  <line x1="630" y1="270" x2="630" y2="284" stroke="#8d939a" stroke-width="0.9" stroke-dasharray="3 3"/>
  <line x1="686" y1="270" x2="686" y2="284" stroke="#8d939a" stroke-width="0.9" stroke-dasharray="3 3"/>
  <line x1="630" y1="276" x2="686" y2="276" stroke="#0083B4" stroke-width="7"/>
  <text x="700" y="300" font-size="13" font-weight="700" fill="#0083B4">P<tspan font-size="10" dy="4">RA</tspan><tspan dy="-4"> rises clearly</tspan></text>

  <text transform="translate(518,170) rotate(-90)" font-size="12.5" text-anchor="middle" fill="#1a1d21">Flow</text>
  <text x="866" y="262" font-size="12.5" fill="#1a1d21">P<tspan font-size="10" dy="4">RA</tspan></text>

  <text x="470" y="336" font-size="11.5" text-anchor="middle" fill="#9aa0a7">Both functions drawn as the straight line approximation of the geometric model.</text>
</svg>
